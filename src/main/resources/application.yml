spring:
  config:
    import: classpath:email-templates.yml
  application:
    name: EmpTimeHub
  profiles:
    active: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8081

jwt:
  secret: dGhpc0lzQWJhc2U2NFNhZmVTZWNyZXRLZXkxMjM=====================
  expiration: 36000000

app:
  initial-setup-required: true
  license-check-enabled: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      type:
        descriptor:
          sql:
            BasicBinder: TRACE

upload:
  dir: uploads/images
